<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#130d2e"/>
      <stop offset="100%" stop-color="#0a0a1f"/>
    </radialGradient>
    <linearGradient id="micGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="micShine" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundRect">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)"/>

  <!-- Subtle background glow -->
  <ellipse cx="512" cy="420" rx="260" ry="200" fill="#8b5cf6" opacity="0.07"/>

  <!-- Outer sound waves -->
  <ellipse cx="512" cy="430" rx="380" ry="230" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.18"/>
  <ellipse cx="512" cy="430" rx="310" ry="188" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.25"/>
  <ellipse cx="512" cy="430" rx="240" ry="146" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.35"/>
  <ellipse cx="512" cy="430" rx="170" ry="105" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.45"/>

  <!-- Wave breaks (dashes on the ellipses) -->
  <ellipse cx="512" cy="430" rx="380" ry="230" fill="none" stroke="#0a0a1f" stroke-width="4" stroke-dasharray="60 999" stroke-dashoffset="0" opacity="1"/>
  <ellipse cx="512" cy="430" rx="380" ry="230" fill="none" stroke="#0a0a1f" stroke-width="4" stroke-dasharray="60 999" stroke-dashoffset="500" opacity="1"/>
  <ellipse cx="512" cy="430" rx="310" ry="188" fill="none" stroke="#0a0a1f" stroke-width="3.5" stroke-dasharray="50 999" stroke-dashoffset="0" opacity="1"/>
  <ellipse cx="512" cy="430" rx="310" ry="188" fill="none" stroke="#0a0a1f" stroke-width="3.5" stroke-dasharray="50 999" stroke-dashoffset="410" opacity="1"/>

  <!-- Microphone body -->
  <rect x="434" y="230" width="156" height="230" rx="78" fill="url(#micGrad)" filter="url(#softglow)"/>
  <!-- Shine on mic -->
  <rect x="434" y="230" width="156" height="230" rx="78" fill="url(#micShine)"/>

  <!-- Mic grille lines -->
  <line x1="464" y1="316" x2="560" y2="316" stroke="#0a0a1f" stroke-width="3" opacity="0.5"/>
  <line x1="456" y1="336" x2="568" y2="336" stroke="#0a0a1f" stroke-width="3" opacity="0.5"/>
  <line x1="456" y1="356" x2="568" y2="356" stroke="#0a0a1f" stroke-width="3" opacity="0.5"/>
  <line x1="464" y1="376" x2="560" y2="376" stroke="#0a0a1f" stroke-width="3" opacity="0.5"/>

  <!-- Mic arc / collar -->
  <path d="M 380 430 Q 380 570 512 590 Q 644 570 644 430" fill="none" stroke="url(#micGrad)" stroke-width="14" stroke-linecap="round" filter="url(#softglow)"/>

  <!-- Stand pole -->
  <line x1="512" y1="590" x2="512" y2="670" stroke="url(#micGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Stand base -->
  <line x1="432" y1="670" x2="592" y2="670" stroke="url(#micGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- ZOVA text -->
  <text x="512" y="790"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="90"
    font-weight="300"
    letter-spacing="28"
    text-anchor="middle"
    fill="#e2d9f3"
    opacity="0.92">ZOVA</text>

  <!-- Pink accent dot under text -->
  <rect x="488" y="816" width="48" height="3" rx="1.5" fill="#ec4899" opacity="0.7"/>
</svg>
