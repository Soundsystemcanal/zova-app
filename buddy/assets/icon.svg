<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a0a3e"/>
      <stop offset="100%" stop-color="#0a0a1f"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)"/>

  <!-- Cosmic sparkles -->
  <circle cx="150" cy="180" r="3" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="880" cy="140" r="4" fill="#f0abfc" opacity="0.5"/>
  <circle cx="920" cy="820" r="3" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="100" cy="880" r="2" fill="#a78bfa" opacity="0.5"/>
  <circle cx="200" cy="750" r="2" fill="#f0abfc" opacity="0.35"/>
  <circle cx="820" cy="300" r="2" fill="#c4b5fd" opacity="0.45"/>

  <!-- Robot body -->
  <rect x="272" y="340" width="480" height="380" rx="60" fill="url(#bodyGrad)"/>

  <!-- Head antenna -->
  <rect x="492" y="220" width="40" height="120" rx="20" fill="#8b5cf6"/>
  <circle cx="512" cy="200" r="32" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="512" cy="200" r="18" fill="#f9a8d4"/>

  <!-- Eyes -->
  <circle cx="390" cy="470" r="64" fill="#0a0a1f"/>
  <circle cx="634" cy="470" r="64" fill="#0a0a1f"/>
  <circle cx="390" cy="470" r="44" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
  <circle cx="634" cy="470" r="44" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
  <circle cx="390" cy="470" r="22" fill="#0a0a1f"/>
  <circle cx="634" cy="470" r="22" fill="#0a0a1f"/>
  <circle cx="376" cy="456" r="8" fill="#ffffff"/>
  <circle cx="620" cy="456" r="8" fill="#ffffff"/>

  <!-- Smile -->
  <path d="M 400 590 Q 512 650 624 590" stroke="#0a0a1f" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Sound waves (voice indicator) -->
  <path d="M 192 480 Q 192 512 192 544" stroke="#ec4899" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 155 450 Q 148 512 155 574" stroke="#ec4899" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M 118 420 Q 106 512 118 604" stroke="#ec4899" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.3"/>

  <path d="M 832 480 Q 832 512 832 544" stroke="#ec4899" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 869 450 Q 876 512 869 574" stroke="#ec4899" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M 906 420 Q 918 512 906 604" stroke="#ec4899" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.3"/>

  <!-- Chest panel -->
  <rect x="412" y="630" width="200" height="50" rx="14" fill="#0a0a1f" opacity="0.4"/>
  <circle cx="462" cy="655" r="10" fill="#ec4899" opacity="0.9"/>
  <circle cx="512" cy="655" r="10" fill="#a78bfa" opacity="0.9"/>
  <circle cx="562" cy="655" r="10" fill="#ec4899" opacity="0.9"/>
</svg>
